# =============================================================================
#  AI Credit-Cascade Early-Warning Monitor  --  configuration
# =============================================================================
#  Every signal resolves to one of: green / amber / red
#  Rule types:
#    absolute    -> status from the current level        (uses amber_above/red_above OR amber_below/red_below)
#    roc         -> status from % change over `lookback` history points
#    categorical -> status from a fixed value->status map (manual signals)
#  If a signal defines both `absolute` and `roc`, the WORSE status wins.
# =============================================================================

fred_api_key: "PUT_YOUR_FREE_FRED_KEY_HERE"   # get one free at https://fred.stlouisfed.org/docs/api/api_key.html

# ---- Automated signals: FRED (free API) ----
signals:

  hy_spread:
    label: "High-Yield credit spread (OAS)"
    category: leading
    source: fred
    series_id: BAMLH0A0HYM2
    unit: "%"
    direction: higher_is_worse
    cascade: true                # part of the "red" cascade trigger set
    roc: { lookback: 63, amber_change_pct: 15, red_change_pct: 30 }   # ~1 quarter of trading days
    absolute: { amber_above: 4.5, red_above: 6.0 }
    note: "The single best free system-stress line. Fast widening = the cascade tell."

  ig_spread:
    label: "Investment-grade credit spread (OAS)"
    category: context
    source: fred
    series_id: BAMLC0A0CM
    unit: "%"
    direction: higher_is_worse
    absolute: { amber_above: 1.3, red_above: 1.8 }
    note: "Stress bleeding from junk into high-grade."

  equity_vol:
    label: "Equity volatility (VIX)"
    category: leading
    source: fred
    series_id: VIXCLS
    unit: ""
    direction: higher_is_worse
    absolute: { amber_above: 22, red_above: 32 }
    note: "Bond-vol (MOVE) is proprietary; VIX is the free stand-in."

  yield_curve:
    label: "2s10s Treasury curve"
    category: context
    source: fred
    series_id: T10Y2Y
    unit: "%"
    direction: lower_is_worse
    absolute: { amber_below: 0.0, red_below: -0.5 }
    note: "Regime context, slow-moving."

  # ---- Automated: market prices (Yahoo via yfinance) ----
  ai_basket_drawdown:
    label: "AI-complex drawdown from high"
    category: leading
    source: market_drawdown
    tickers: ["NVDA", "MSFT", "GOOGL", "AMZN", "META", "AVGO", "CRWV"]
    unit: "%"
    direction: lower_is_worse    # a deeper (more negative) drawdown is worse
    absolute: { amber_below: -12, red_below: -25 }
    note: "Equal-weight basket of the names at the centre of the thesis."

  # ---- Automated: computed from SEC EDGAR filings (see src/edgar.py) ----
  hyperscaler_capex:
    label: "Hyperscaler capex direction"
    category: leading
    source: edgar
    direction: categorical
    categorical: { raising: green, holding: amber, cutting: red }
    note: "1st derivative: aggregate MSFT+GOOGL+AMZN+META quarterly capex, YoY. Computed from filings."

  hyperscaler_capex_accel:
    label: "Hyperscaler capex acceleration"
    category: leading
    source: edgar
    direction: categorical
    cascade: true
    categorical: { accelerating: green, stabilizing: amber, contracting: red }
    note: "Change in the TTM capex-growth rate, quarter over quarter. Contracting = the roll-over the thesis watches for. Computed from filings."

  capex_growth_ttm:
    label: "Hyperscaler capex growth (TTM curve)"
    category: leading
    source: edgar
    unit: "%"
    direction: lower_is_worse
    absolute: { amber_below: 15, red_below: 0 }
    note: "Trailing-12-month capex vs a year ago, updated each quarter (deseasonalized). Its sparkline is the acceleration curve — watch it bend before it crosses zero."

  capex_to_ocf:
    label: "Aggregate capex / operating cash flow"
    category: leading
    source: edgar
    unit: "%"
    direction: higher_is_worse
    absolute: { amber_above: 80, red_above: 100 }
    note: "TTM hyperscaler capex / operating cash flow. Above 100% the build isn't self-funded. Computed from filings."

# ---- Manual signals: no clean free API. Update signals_manual.yaml periodically. ----
# (definitions here; live values in signals_manual.yaml)
manual_signals:

  gpu_rent_h100:
    label: "H100 rental rate ($/GPU-hr)"
    category: leading
    unit: "$/hr"
    direction: lower_is_worse
    cascade: true
    roc: { lookback: 1, amber_change_pct: -15, red_change_pct: -30 }  # vs your previous entry
    source_hint: "GPU-cloud price trackers (e.g. vast.ai board, published H100 indices)."

  marginal_loan_quality:
    label: "Marginal GPU-loan quality"
    category: leading
    direction: categorical
    cascade: true
    categorical: { investment_grade: green, crossover: amber, junk: red, stalled: red }
    source_hint: "Ratings/spreads on the newest neocloud DDTL or bond (CoreWeave, Nebius, Crusoe, Lambda)."
    news_query: 'CoreWeave OR Nebius OR Crusoe OR Lambda debt OR bond OR downgrade OR rating'
    news_days: 21

  depreciation_disclosure:
    label: "Server-life / impairment disclosures"
    category: leading
    direction: categorical
    categorical: { extending: green, stable: green, shortening: amber, charge_taken: red }
    source_hint: "10-Q footnotes & earnings calls: is anyone SHORTENING useful life or taking a charge?"
    news_query: 'hyperscaler server "useful life" OR impairment depreciation AI chips'
    news_days: 21

  ai_lab_rounds:
    label: "AI-lab funding rounds"
    category: leading
    direction: categorical
    categorical: { up_round: green, flat: amber, delayed: amber, down_round: red }
    source_hint: "OpenAI / Anthropic / xAI latest raise: up, flat, delayed, or down."
    news_query: 'OpenAI OR Anthropic OR xAI funding round valuation'
    news_days: 21

  neocloud_events:
    label: "Neocloud covenant / default events"
    category: leading
    direction: categorical
    cascade: true
    categorical: { none: green, stress: amber, covenant_breach: red, default: red }
    source_hint: "Filings/credit news: any coverage-covenant breach or forced GPU sale?"
    news_query: 'neocloud OR CoreWeave OR Crusoe default OR covenant OR "forced sale" OR bankruptcy GPU'
    news_days: 21

  # ===== Added from "The Second Derivative" — watch the ACCELERATION, not the level =====
  capex_cut_rewarded:
    label: "Reflexive flip — is a capex cut rewarded?"
    category: leading
    direction: categorical
    cascade: true
    stale_days: 100
    categorical: { none: green, cut_announced: amber, cut_rewarded: red }
    source_hint: "Has a hyperscaler announced a capex CUT and seen its stock RISE on it? That inversion ends the arms race. Watch Meta/Zuckerberg first."
    news_query: 'Microsoft OR Meta OR Google OR Amazon capex cut OR reduce data center spending'
    news_days: 21

  # ===== Added from "The Teaser Period" — the funding treadmill & the reset wall =====
  openai_step_up:
    label: "OpenAI round-over-round step-up"
    category: leading
    unit: "x"
    direction: lower_is_worse
    cascade: true
    stale_days: 180                # only moves on a new raise
    absolute: { amber_below: 1.5, red_below: 1.3 }
    source_hint: "Each new OpenAI raise ÷ the prior valuation. The treadmill: prior steps ran 1.7–1.9×; the implied IPO step is ~1.23×. Nearing 1.0× = the refinance is failing."
    news_query: 'OpenAI funding round valuation billion'
    news_days: 21

  openai_ipo_status:
    label: "OpenAI terminal refinance (IPO)"
    category: leading
    direction: categorical
    cascade: true
    stale_days: 120
    categorical: { on_track: green, delayed: amber, pulled: red, priced_below: red }
    source_hint: "The refinance of last resort. On track, delayed, pulled, or pricing below the last private mark? The delay is itself the signal."
    news_query: 'OpenAI IPO'
    news_days: 21

  contract_renegotiation:
    label: "Take-or-pay contract renegotiation"
    category: leading
    direction: categorical
    cascade: true
    stale_days: 90
    categorical: { none: green, rumored: amber, confirmed: red }
    source_hint: "The reset-wall trigger. Any compute take-or-pay deal deferred/renegotiated ('capacity rephasing', 'efficiency-linked pricing')? The first amendment re-rates the whole $2.3T backlog."
    news_query: 'AI compute OR data center contract renegotiate OR "take-or-pay" OR "capacity rephasing"'
    news_days: 21

  index_concentration:
    label: "S&P 500 top-10 weight"
    category: context
    unit: "%"
    direction: higher_is_worse
    stale_days: 120
    absolute: { amber_above: 38, red_above: 45 }
    source_hint: "Top-10 (mostly AI) share of S&P 500 market cap — i.e. your own ETF's concentration. ~40% now vs ~27% at the dot-com peak. From S&P / index factsheets."

# ---- Overall status logic (your playbook) ----
playbook:
  green:
    headline: "STABLE"
    action: "Hold target 70/30. Keep dollar-cost-averaging the €120k/yr into equities. Rebalance quarterly. Dry powder stays dry. Lombard remains parked."
  amber:
    headline: "WATCH"
    action: "Stop feeding NEW money into equities — redirect contributions to cash/gold/bonds. Trim the most concentrated sleeves (cap-weight US down; equal-weight & factor stay) by ~a third, tax-free. Keep the Lombard shelved."
  red:
    headline: "ACT"
    action: "Move within days. Cut equity toward the ~35% floor; max cash / gold / short bonds. Your Beckham window means you can brake with ZERO CGT. Then wait, and redeploy dry powder in tranches on the way back."
  # thresholds
  amber_if_leading_alerts_at_least: 2      # 2+ leading signals amber-or-worse -> WATCH
  red_if_reds_at_least: 2                   # any 2 red signals -> ACT
  red_if_cascade_red_and_hy_amber: true    # a cascade signal red WHILE hy_spread amber+ -> ACT
