name: Update dashboard

on:
  schedule:
    - cron: "17 6 * * 1-5"     # ~08:17 Madrid (summer) — odd minute dodges congested slots
    - cron: "23 8 * * 1-5"     # mid-morning backup in case the first is skipped
  workflow_dispatch:
  push:
    paths:
      - "signals_manual.yaml"
      - "config.yaml"

permissions:
  contents: write              # needed so the job can commit history.csv back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build dashboard from live data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python src/main.py --output docs/index.html --refresh 1800
          touch docs/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Save history back to the repo
        run: |
          git config user.name  "signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.csv
          git commit -m "history $(date -u +%F)" || echo "no change to commit"
          git push || echo "push skipped"
