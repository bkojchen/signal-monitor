name: Update dashboard

# Refreshes the live dashboard automatically.
on:
  schedule:
    - cron: "30 6 * * 1-5"        # 06:30 UTC, weekdays (markets/data are fresh by then)
  workflow_dispatch:              # a "Run now" button in the Actions tab
  push:
    paths:                        # editing your readings rebuilds immediately
      - "signals_manual.yaml"
      - "config.yaml"

permissions:
  contents: write                 # lets the job commit the refreshed page + history back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build dashboard from live data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # set this in repo Settings → Secrets
        run: |
          python src/main.py --output docs/index.html --refresh 1800
          touch docs/.nojekyll

      - name: Commit refreshed page + history
        run: |
          git config user.name  "signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          git commit -m "refresh dashboard $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push
