name: Update dashboard

on:
  schedule:
    - cron: "17 6 * * 1-5"     # ~08:17 Madrid — odd minute dodges the congested slots
    - cron: "23 8 * * 1-5"     # a mid-morning backup in case the first is skipped
  workflow_dispatch:
  push:
    paths:
      - "signals_manual.yaml"
      - "config.yaml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build dashboard from live data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python src/main.py --output docs/index.html --refresh 1800
          touch docs/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5
